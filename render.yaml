# Render Blueprint — Fishmaster API
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → connect GitHub repo
#
# Database is the existing Neon project (members already live there).
# Do not add a Render Postgres here — that would be an empty second database.
# In Render → fishmaster-api → Environment, set DATABASE_URL to the Neon URL.
# Use the direct (non-pooler) URL so prisma db push in the build can connect.
#
# ── Schema migrations ─────────────────────────────────────────────────────────
# db:push runs in buildCommand (applies Prisma schema on every deploy).
# Tradeoff: simple for early prod; for strict migrations switch to prisma migrate deploy.
#
# ── Seeding ───────────────────────────────────────────────────────────────────
# initialDeployHook runs db:seed-if-enabled — seed ONLY when SEED_ON_DEPLOY=true.
# First deploy: set SEED_ON_DEPLOY=true once, redeploy, then set back to false.

services:
  - type: web
    name: fishmaster-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --legacy-peer-deps --ignore-scripts && npm run build:api && npm run db:push -w @fishmaster/db
    startCommand: npm run start:api
    initialDeployHook: npm run db:seed-if-enabled -w @fishmaster/db
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ELECTRICITY_RATE_NGN
        value: "85"
      - key: DIESEL_RATE_NGN
        value: "1200"
      - key: PETROL_RATE_NGN
        value: "1100"
      - key: SEED_ON_DEPLOY
        value: "false"
      - key: DATABASE_URL
        sync: false
