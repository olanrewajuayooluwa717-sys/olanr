name: Production verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  production-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify production config files
        run: npx tsx scripts/verify-production-config.ts

      - name: Confirm env example files exist
        run: |
          test -f .env.example
          test -f apps/web/.env.production.example
          test -f apps/mobile/.env.example

      - name: Confirm build scripts defined
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts['build:api']||!p.scripts['start:api']) process.exit(1)"
