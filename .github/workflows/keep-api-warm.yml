# Manual wake only — scheduled pings were tripping Cloudflare rate limits on Render free.
name: Keep API warm

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API
        run: |
          code=$(curl -sS -o /tmp/fm-health.json -w '%{http_code}' --max-time 90 \
            -A 'FishmasterKeepWarm/1.0' \
            https://fishmaster-api.onrender.com/health || echo 000)
          echo "HTTP $code"
          cat /tmp/fm-health.json || true
          exit 0
